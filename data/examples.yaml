# Curated few-shot examples for schema grounding and SQL generation
# These represent idiomatic SQLite patterns over the business schema.

examples:
  - question: "Which customers have placed more than 15 orders?"
    sql: |
      SELECT c.id, c.name, COUNT(o.id) AS total_orders
      FROM customers c
      JOIN orders o ON c.id = o.customer_id
      GROUP BY c.id, c.name
      HAVING COUNT(o.id) > 15
      ORDER BY total_orders DESC;
    tables: ["customers", "orders"]
    technique: "JOIN, GROUP BY with HAVING"

  - question: "What are the top 5 best-selling products by total revenue?"
    sql: |
      SELECT p.id, p.name, ROUND(SUM(oi.quantity * oi.unit_price * (1 - oi.discount)), 2) AS total_revenue
      FROM products p
      JOIN order_items oi ON p.id = oi.product_id
      JOIN orders o ON oi.order_id = o.id
      WHERE o.status != 'Cancelled'
      GROUP BY p.id, p.name
      ORDER BY total_revenue DESC
      LIMIT 5;
    tables: ["products", "order_items", "orders"]
    technique: "Multi-table JOIN, Aggregation, Ranking, LIMIT"

  - question: "Find all customers who have never placed an order."
    sql: |
      SELECT c.id, c.name, c.email
      FROM customers c
      LEFT JOIN orders o ON c.id = o.customer_id
      WHERE o.id IS NULL;
    tables: ["customers", "orders"]
    technique: "LEFT JOIN, NULL check for non-existence"

  - question: "Show total sales revenue for each product category in 2024."
    sql: |
      SELECT cat.name AS category_name, ROUND(SUM(oi.quantity * oi.unit_price * (1 - oi.discount)), 2) AS category_revenue
      FROM categories cat
      JOIN products p ON cat.id = p.category_id
      JOIN order_items oi ON p.id = oi.product_id
      JOIN orders o ON oi.order_id = o.id
      WHERE o.order_date >= '2024-01-01' AND o.order_date <= '2024-12-31' AND o.status != 'Cancelled'
      GROUP BY cat.id, cat.name
      ORDER BY category_revenue DESC;
    tables: ["categories", "products", "order_items", "orders"]
    technique: "Multi-table JOIN, Date range filter, Aggregation"

  - question: "Which products have a unit price higher than the average price in their category?"
    sql: |
      SELECT p.id, p.name, p.unit_price, p.category_id
      FROM products p
      WHERE p.unit_price > (
          SELECT AVG(p2.unit_price)
          FROM products p2
          WHERE p2.category_id = p.category_id
      )
      ORDER BY p.unit_price DESC;
    tables: ["products"]
    technique: "Correlated subquery, Comparative filter"

  - question: "List all orders that have not yet shipped and their current status."
    sql: |
      SELECT o.id, o.order_date, o.status, c.name AS customer_name
      FROM orders o
      JOIN customers c ON o.customer_id = c.id
      WHERE o.ship_date IS NULL
      ORDER BY o.order_date ASC;
    tables: ["orders", "customers"]
    technique: "IS NULL filter, JOIN"

  - question: "How many employees report to each manager?"
    sql: |
      SELECT m.id AS manager_id, m.name AS manager_name, COUNT(e.id) AS direct_reports
      FROM employees e
      JOIN employees m ON e.manager_id = m.id
      GROUP BY m.id, m.name
      ORDER BY direct_reports DESC;
    tables: ["employees"]
    technique: "Self-JOIN, GROUP BY"

  - question: "What is the breakdown of total payment amounts by payment method?"
    sql: |
      SELECT method, ROUND(SUM(amount), 2) AS total_amount, COUNT(*) AS transaction_count
      FROM payments
      GROUP BY method
      ORDER BY total_amount DESC;
    tables: ["payments"]
    technique: "GROUP BY aggregation"

  - question: "List suppliers located in Germany or Japan that supply products with low stock (less than 25 units)."
    sql: |
      SELECT DISTINCT s.name AS supplier_name, s.country, p.name AS product_name, p.stock_quantity
      FROM suppliers s
      JOIN products p ON s.id = p.supplier_id
      WHERE s.country IN ('Germany', 'Japan') AND p.stock_quantity < 25
      ORDER BY p.stock_quantity ASC;
    tables: ["suppliers", "products"]
    technique: "JOIN, IN list filter, Comparison"

  - question: "What is the total revenue generated by each sales region?"
    sql: |
      SELECT e.region, ROUND(SUM(oi.quantity * oi.unit_price * (1 - oi.discount)), 2) AS regional_revenue
      FROM employees e
      JOIN orders o ON e.id = o.employee_id
      JOIN order_items oi ON o.id = oi.order_id
      WHERE o.status != 'Cancelled'
      GROUP BY e.region
      ORDER BY regional_revenue DESC;
    tables: ["employees", "orders", "order_items"]
    technique: "Multi-table JOIN, Regional aggregation"

  - question: "List the top 3 corporate customers with the highest average order discount."
    sql: |
      SELECT c.id, c.name, ROUND(AVG(oi.discount) * 100, 2) AS avg_discount_pct
      FROM customers c
      JOIN orders o ON c.id = o.customer_id
      JOIN order_items oi ON o.id = oi.order_id
      WHERE c.segment = 'Corporate'
      GROUP BY c.id, c.name
      ORDER BY avg_discount_pct DESC
      LIMIT 3;
    tables: ["customers", "orders", "order_items"]
    technique: "JOIN, WHERE filter, AVG aggregation, LIMIT"

  - question: "Which products have never been ordered?"
    sql: |
      SELECT p.id, p.name, p.unit_price, p.stock_quantity
      FROM products p
      LEFT JOIN order_items oi ON p.id = oi.product_id
      WHERE oi.id IS NULL;
    tables: ["products", "order_items"]
    technique: "LEFT JOIN, Anti-join NULL filter"

  - question: "Find monthly order counts and total sales for 2024."
    sql: |
      SELECT SUBSTR(o.order_date, 1, 7) AS order_month, COUNT(DISTINCT o.id) AS order_count, ROUND(SUM(oi.quantity * oi.unit_price * (1 - oi.discount)), 2) AS total_sales
      FROM orders o
      JOIN order_items oi ON o.id = oi.order_id
      WHERE o.order_date LIKE '2024%' AND o.status != 'Cancelled'
      GROUP BY SUBSTR(o.order_date, 1, 7)
      ORDER BY order_month ASC;
    tables: ["orders", "order_items"]
    technique: "Date string manipulation, Aggregation, Time series"

  - question: "What is the average order value (AOV) for each customer segment?"
    sql: |
      SELECT c.segment, ROUND(SUM(oi.quantity * oi.unit_price * (1 - oi.discount)) / COUNT(DISTINCT o.id), 2) AS avg_order_value
      FROM customers c
      JOIN orders o ON c.id = o.customer_id
      JOIN order_items oi ON o.id = oi.order_id
      WHERE o.status != 'Cancelled'
      GROUP BY c.segment
      ORDER BY avg_order_value DESC;
    tables: ["customers", "orders", "order_items"]
    technique: "Segment aggregation, Ratio computation"

  - question: "Find orders where the total quantity of items exceeds 15."
    sql: |
      SELECT o.id AS order_id, o.order_date, c.name AS customer_name, SUM(oi.quantity) AS total_items
      FROM orders o
      JOIN customers c ON o.customer_id = c.id
      JOIN order_items oi ON o.id = oi.order_id
      GROUP BY o.id, o.order_date, c.name
      HAVING SUM(oi.quantity) > 15
      ORDER BY total_items DESC;
    tables: ["orders", "customers", "order_items"]
    technique: "Multi-table JOIN, HAVING filter"

  - question: "What is the average shipping delay in days for shipped orders by carrier destination state?"
    sql: |
      SELECT c.state, ROUND(AVG(JULIANDAY(o.ship_date) - JULIANDAY(o.order_date)), 2) AS avg_ship_days
      FROM orders o
      JOIN customers c ON o.customer_id = c.id
      WHERE o.ship_date IS NOT NULL
      GROUP BY c.state
      ORDER BY avg_ship_days DESC;
    tables: ["orders", "customers"]
    technique: "SQLite JULIANDAY date arithmetic, AVG"

